    <rect x="452" y="250" width="320" height="220" rx="20" fill="url(#card)" stroke="#3DDC97" stroke-width="2"/>
    <circle cx="492" cy="300" r="18" fill="#10281F" stroke="#3DDC97" stroke-width="2"/>
    <text x="486" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#8FF0C4">2</text>
    <text x="524" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" fill="#EAFBF3">Execute</text>
