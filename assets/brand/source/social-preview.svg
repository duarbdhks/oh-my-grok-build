    <text x="476" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Owned tasks. Worktree isolation.</text>
    <text x="476" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Bounded native parallelism</text>
  </g>
  <path d="M788 360h28" stroke="#3A4A61" stroke-width="4" stroke-linecap="round"/>
  <path d="M808 352l12 8-12 8" fill="none" stroke="#3A4A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="832" y="250" width="296" height="220" rx="20" fill="url(#card)" stroke="#F0B429" stroke-width="2"/>
    <circle cx="872" cy="300" r="18" fill="#2A220F" stroke="#F0B429" stroke-width="2"/>
    <text x="866" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#F6D27A">3</text>
    <text x="904" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" fill="#FFF6DE">Verify</text>
    <text x="856" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#A9B7CC">/ogb-verify</text>
    <text x="856" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Independent of the implementer.</text>
    <text x="856" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Evidence over confidence</text>
