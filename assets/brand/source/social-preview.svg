  <text x="212" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="44" font-weight="700" fill="#F3F6FB">oh-my-grok-build</text>
  <text x="212" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#9AA8BD">Discipline for native Grok Build orchestration</text>
