    <text x="96" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Consensus. No source edits.</text>
    <text x="96" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#7F8FA6">Planner → Architect → Critic</text>
  </g>
  <path d="M408 360h28" stroke="#3A4A61" stroke-width="4" stroke-linecap="round"/>
  <path d="M428 352l12 8-12 8" fill="none" stroke="#3A4A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
