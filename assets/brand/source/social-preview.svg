  <g>
    <rect x="72" y="250" width="320" height="220" rx="20" fill="url(#card)" stroke="#5B8DEF" stroke-width="2"/>
    <circle cx="112" cy="300" r="18" fill="#1A2740" stroke="#5B8DEF" stroke-width="2"/>
    <text x="106" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#9EC0FF">1</text>
    <text x="144" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" fill="#EAF1FF">Plan</text>
