  <text x="72" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#7F8FA6">Independent open-source plugin · not affiliated with xAI</text>
  <text x="72" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#5B6B82">Content-only · no second runtime · native worktrees &amp; workflows</text>
