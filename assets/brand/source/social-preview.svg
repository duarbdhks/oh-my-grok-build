<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="oh-my-grok-build social preview: plan, execute, verify on Grok Build">
  <title>oh-my-grok-build social preview</title>
  <defs>
