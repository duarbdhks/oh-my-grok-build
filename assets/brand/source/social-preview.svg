    <circle cx="30" cy="34" r="4" fill="#F07178"/>
    <circle cx="42" cy="34" r="4" fill="#E6C07B"/>
    <circle cx="54" cy="34" r="4" fill="#7FD99A"/>
    <rect x="28" y="48" width="34" height="7" rx="3.5" fill="#5B8DEF"/>
    <rect x="28" y="62" width="42" height="7" rx="3.5" fill="#3DDC97"/>
    <rect x="28" y="76" width="26" height="7" rx="3.5" fill="#F0B429"/>
