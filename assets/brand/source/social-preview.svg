      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#121A28"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151D2B"/>
      <stop offset="100%" stop-color="#0E1520"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1C2738" stroke-width="1" opacity="0.55">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>
  <!-- mark -->
  <g transform="translate(72,72)">
