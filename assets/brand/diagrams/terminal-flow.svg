<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Static terminal mockup of an OGB command flow">
  <title>OGB terminal flow mockup (static illustration)</title>
  <rect width="960" height="540" rx="16" fill="#070B12"/>
  <!-- window chrome -->
  <rect x="40" y="36" width="880" height="468" rx="14" fill="#0E1520" stroke="#243044" stroke-width="2"/>
  <circle cx="72" cy="64" r="7" fill="#F07178"/>
  <circle cx="96" cy="64" r="7" fill="#E6C07B"/>
  <circle cx="120" cy="64" r="7" fill="#7FD99A"/>
  <text x="150" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#7F8FA6">grok · oh-my-grok-build · static mockup</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
    <text x="72" y="120" fill="#5B6B82"># Static illustration — not a live session capture</text>

    <text x="72" y="164" fill="#8B9BB4">$</text>
    <text x="96" y="164" fill="#E8EEF5">/ogb-doctor</text>
    <text x="72" y="192" fill="#3DDC97">PASS  plugin enabled · 7 skills · 6 agents</text>

    <text x="72" y="236" fill="#8B9BB4">$</text>
    <text x="96" y="236" fill="#E8EEF5">/ogb-plan Add rate limiting to the public API</text>
    <text x="72" y="264" fill="#5B8DEF">PLAN  pending approval · no source edits</text>
    <text x="72" y="292" fill="#7F8FA6">       planner → architect → critic</text>

    <text x="72" y="336" fill="#8B9BB4">$</text>
    <text x="96" y="336" fill="#E8EEF5">/view-plan</text>
    <text x="72" y="364" fill="#7F8FA6">       native Grok control · inspect saved plan</text>

    <text x="72" y="408" fill="#8B9BB4">$</text>
    <text x="96" y="408" fill="#E8EEF5">/ogb-start Implement the currently approved plan</text>
    <text x="72" y="436" fill="#3DDC97">DONE  worktree-isolated executors · checks green</text>

    <text x="72" y="480" fill="#8B9BB4">$</text>
    <text x="96" y="480" fill="#E8EEF5">/ogb-verify Re-check acceptance criteria</text>
  </g>
</svg>
